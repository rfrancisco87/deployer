name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default: only the `release` job below is granted write
# access, so a compromised build step can't push commits, tags or releases.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-14
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions are pinned to full commit SHAs: a tag like `@v4` is
      # mutable and can be repointed at malicious code by whoever owns the repo.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate tray icons
        run: node scripts/generate-tray-icons.js

      - name: Build
        run: npm run build

      - name: Package (${{ matrix.arch }})
        # `--publish never` prevents electron-builder from trying to upload
        # to GitHub Releases itself; the downstream `release` job uses
        # softprops/action-gh-release to publish instead.
        run: PATH="$PWD/scripts/shims:$PATH" npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload the .dmg/.zip assets
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' \) -exec mv {} out/ \;
          ls -la out/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
